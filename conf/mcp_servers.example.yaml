# Copy the server entries into app_config.yaml under mcp.servers.
- name: local-tools
  transport: stdio
  command: python
  args: ["-m", "my_mcp_server"]
  tools: []
  allowed_roles: [admin]
  allowed_intents: [tool_call]
  read_only: true

# Remote MCP servers may use SSE:
# - name: remote-tools
#   transport: sse
#   url: https://example.com/mcp/sse
#   tools: [search]
#   allowed_roles: [user, admin]

# Drawing/image MCP server example. ImageContent blocks are preserved as
